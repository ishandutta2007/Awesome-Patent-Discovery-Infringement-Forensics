<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="45%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="grid-pattern" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.04" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.04" />
    </linearGradient>

    <linearGradient id="patent-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f0f9ff" />
      <stop offset="75%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-bright" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-ambient" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="text-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Animations -->
    <style>
      @keyframes forensicRadar {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseAura {
        0%, 100% { r: 130px; opacity: 0.25; }
        50% { r: 155px; opacity: 0.65; }
      }
      @keyframes pulseInner {
        0%, 100% { r: 80px; opacity: 0.35; }
        50% { r: 96px; opacity: 0.75; }
      }
      @keyframes nodePulse {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.3); opacity: 1; }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes floatY1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatY2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(7px); }
      }

      .radar-sweep {
        transform-origin: 1010px 210px;
        animation: forensicRadar 9s linear infinite;
      }
      .ring-aura {
        animation: pulseAura 4.5s ease-in-out infinite;
      }
      .ring-inner {
        animation: pulseInner 3.2s ease-in-out infinite;
      }
      .dash-circuit {
        stroke-dasharray: 8 6;
        animation: dashFlow 12s linear infinite;
      }
      .pill-float-1 {
        animation: floatY1 5.5s ease-in-out infinite;
      }
      .pill-float-2 {
        animation: floatY2 6.5s ease-in-out infinite;
      }
      .pulse-node-1 { animation: nodePulse 2.8s ease-in-out infinite; transform-origin: 940px 140px; }
      .pulse-node-2 { animation: nodePulse 3.4s ease-in-out infinite 0.6s; transform-origin: 1080px 150px; }
      .pulse-node-3 { animation: nodePulse 2.5s ease-in-out infinite 1.2s; transform-origin: 1090px 280px; }
      .pulse-node-4 { animation: nodePulse 3.1s ease-in-out infinite 1.8s; transform-origin: 930px 270px; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />

  <!-- Digital IP Grid -->
  <g opacity="0.16">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300 M 0 360 L 1200 360" stroke="#38bdf8" stroke-width="0.8" />
    <path d="M 120 0 L 120 420 M 240 0 L 240 420 M 360 0 L 360 420 M 480 0 L 480 420 M 600 0 L 600 420 M 720 0 L 720 420 M 840 0 L 840 420 M 960 0 L 960 420 M 1080 0 L 1080 420" stroke="#38bdf8" stroke-width="0.8" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="1010" cy="210" r="190" fill="#4f46e5" opacity="0.14" filter="url(#glow-ambient)" />
  <circle cx="160" cy="70" r="130" fill="#0284c7" opacity="0.1" filter="url(#glow-ambient)" />
  <circle cx="680" cy="350" r="140" fill="#7c3aed" opacity="0.08" filter="url(#glow-ambient)" />

  <!-- Animated Citation Graph & Forensic Radar Scanner (Right Side Background) -->
  <g id="forensic-graphics" opacity="0.85">
    <!-- Concentric Range Rings -->
    <circle cx="1010" cy="210" r="185" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="4 8" opacity="0.25" />
    <circle class="ring-aura" cx="1010" cy="210" r="135" fill="none" stroke="#38bdf8" stroke-width="1.4" opacity="0.35" />
    <circle class="ring-inner" cx="1010" cy="210" r="85" fill="none" stroke="#a855f7" stroke-width="1.8" opacity="0.45" />
    <circle cx="1010" cy="210" r="35" fill="#1e1b4b" fill-opacity="0.4" stroke="#818cf8" stroke-width="2" />

    <!-- Radar Crosshairs -->
    <line x1="825" y1="210" x2="1195" y2="210" stroke="#818cf8" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="3 5" />
    <line x1="1010" y1="25" x2="1010" y2="395" stroke="#818cf8" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="3 5" />

    <!-- Rotating Radar Scanner Beam -->
    <g class="radar-sweep">
      <path d="M 1010 210 L 1180 155 A 185 185 0 0 0 1145 90 Z" fill="url(#patent-beam)" />
      <line x1="1010" y1="210" x2="1180" y2="155" stroke="#38bdf8" stroke-width="2" filter="url(#glow-bright)" opacity="0.85" />
    </g>

    <!-- Patent Citation Graph Constellation -->
    <path class="dash-circuit" d="M 940 140 L 1010 210 L 1080 150 M 1010 210 L 1090 280 M 1010 210 L 930 270 M 940 140 L 1080 150 M 930 270 L 1090 280" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.45" fill="none" />

    <!-- Citation Nodes with animated glow -->
    <circle class="pulse-node-1" cx="940" cy="140" r="6" fill="#38bdf8" filter="url(#glow-bright)" />
    <circle class="pulse-node-2" cx="1080" cy="150" r="7" fill="#818cf8" filter="url(#glow-bright)" />
    <circle class="pulse-node-3" cx="1090" cy="280" r="6" fill="#c084fc" filter="url(#glow-bright)" />
    <circle class="pulse-node-4" cx="930" cy="270" r="7.5" fill="#34d399" filter="url(#glow-bright)" />
    
    <!-- Central Patent Node (Bullseye) -->
    <circle cx="1010" cy="210" r="9" fill="#f8fafc" filter="url(#glow-bright)" />
    <circle cx="1010" cy="210" r="4" fill="#6366f1" />

    <!-- Node Labels / Jurisdiction Tags -->
    <text x="940" y="125" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle" opacity="0.8">USPTO</text>
    <text x="1080" y="135" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle" opacity="0.8">EPO</text>
    <text x="1090" y="302" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle" opacity="0.8">WIPO</text>
    <text x="930" y="292" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle" opacity="0.8">KIPRIS</text>
  </g>

  <!-- FOREGROUND TEXT SECTION (Left aligned, high z-index, zero occlusion) -->
  <g id="foreground-content" transform="translate(64, 0)">
    
    <!-- Top Pill Category Badge -->
    <g transform="translate(0, 52)">
      <rect width="365" height="32" rx="16" fill="url(#pill-bg)" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="18" cy="16" r="5" fill="#10b981" filter="url(#glow-bright)">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.8">⚖️ INTELLECTUAL PROPERTY &amp; LEGALTECH</text>
    </g>

    <!-- Main Repository Title -->
    <text x="0" y="138" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="37" font-weight="900" letter-spacing="-0.5" filter="url(#text-shadow)">Awesome Patent Discovery</text>
    <text x="0" y="184" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" filter="url(#text-shadow)">&amp; Infringement Forensics</text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="226" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500">
      Enterprise SaaS Platforms, AI Claim Analytics, Prior Art Discovery &amp;
    </text>
    <text x="0" y="248" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500">
      Open-Source Toolchains for IP Counsel &amp; LegalTech Engineers
    </text>

    <!-- Decorative Accent Line -->
    <line x1="0" y1="272" x2="480" y2="272" stroke="url(#badge-glow)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Feature Pill Badges -->
    <g transform="translate(0, 296)">
      <!-- Pill 1: AI Claim Mapping -->
      <g class="pill-float-1" transform="translate(0, 0)">
        <rect width="148" height="34" rx="17" fill="url(#pill-bg)" stroke="#38bdf8" stroke-width="1.2" />
        <text x="14" y="22" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔬 AI Claim Mapping</text>
      </g>

      <!-- Pill 2: Infringement Detection -->
      <g class="pill-float-2" transform="translate(158, 0)">
        <rect width="170" height="34" rx="17" fill="url(#pill-bg)" stroke="#818cf8" stroke-width="1.2" />
        <text x="14" y="22" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ Infringement Forensics</text>
      </g>

      <!-- Pill 3: SEP Analytics -->
      <g class="pill-float-1" transform="translate(338, 0)">
        <rect width="136" height="34" rx="17" fill="url(#pill-bg)" stroke="#c084fc" stroke-width="1.2" />
        <text x="14" y="22" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📊 SEP Analytics</text>
      </g>

      <!-- Pill 4: Prior Art Search -->
      <g class="pill-float-2" transform="translate(484, 0)">
        <rect width="144" height="34" rx="17" fill="url(#pill-bg)" stroke="#34d399" stroke-width="1.2" />
        <text x="14" y="22" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔍 Prior Art Search</text>
      </g>
    </g>

    <!-- Bottom Stat / Jurisdiction Banner -->
    <g transform="translate(0, 362)">
      <text x="0" y="14" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
        🌐 Coverage: <tspan fill="#94a3b8" font-weight="600">USPTO • EPO • WIPO • CNIPA • JPO • KIPO</tspan> | 160+ Global Jurisdictions
      </text>
    </g>

  </g>
</svg>
